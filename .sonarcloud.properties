# SonarCloud automatic analysis configuration.
#
# Keep the quality gate focused on shipped plugin/runtime code. Test files
# intentionally manipulate PATH, spawn mock binaries, and mirror provider smoke
# flows, which otherwise produce security-hotspot and duplication noise. The
# scripts/ab/ A/B harness + root-cause reproductions are the same category:
# investigation tooling that feeds synthetic secret-shaped fixtures to the
# redactor, uses tmpdir, and extracts/executes real function bodies from source
# to prove behavior — not shipped runtime code, so it is excluded from the gate.
sonar.sources=plugins,scripts
sonar.tests=tests
sonar.exclusions=tests/**,plugins/kimi/scripts/**,plugins/agy/scripts/**,scripts/ab/**

# Do not use CPD exclusions as permission for model-specific copy-paste. These
# exclusions cover generated/synced packaging copies and legacy mirrored helper
# files while the runtime source of truth is moved into shared modules. Codex
# installs each plugin as a self-contained root, so canonical scripts/lib/*.mjs
# helpers are copied into plugin packages and guarded by sync tests.
# grok-web-reviewer.mjs and api-reviewer.mjs are standalone lifecycle reviewer
# engines in separate plugin roots (divergent card helpers) that cannot import
# the shared companion-common renderer; their "### REVIEW FINDINGS" parity is
# enforced by tests/unit/lifecycle-findings-parity.test.mjs, so a CPD exclusion
# here does not relax the guarantee that every renderer surfaces record.result.
